x-liquibase: &liquibase
  image: liquibase/liquibase:4.29
  restart: "no"
  environment:
    LIQUIBASE_COMMAND_URL: jdbc:sqlserver://sqlserver:1433;databaseName=${MSSQL_DATABASE};encrypt=false;trustServerCertificate=true
    LIQUIBASE_COMMAND_USERNAME: ${MSSQL_USER}
    LIQUIBASE_COMMAND_PASSWORD: ${MSSQL_SA_PASSWORD}
  volumes:
    - ${SCHOOL_GUARDIAN_DB_DIR:-.}:/db
  networks:
    - sg-services-network

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: school-guardian-db-dev
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      # SQL Server stores everything under /var/opt/mssql (data, log, secrets).
      # Mounting anywhere else (e.g. /var/lib/mssql/data) leaves the real data
<<<<<<< HEAD
      # outside the volume, so every container recreate starts on an empty instance.
=======
      # in the container's writable layer, so `docker compose down` wipes the DB.
>>>>>>> parent of 25fef08 (Revert "fix(database): make fresh bootstrap deterministic across schemas")
      - school-guardian-sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -d master -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\""
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - sg-services-network

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: school-guardian-db-init
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    depends_on:
      sqlserver:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd
        -S sqlserver,1433
        -U sa
        -P "$$MSSQL_SA_PASSWORD"
        -d master
        -C
        -Q "IF DB_ID(N'${MSSQL_DATABASE}') IS NULL BEGIN EXEC('CREATE DATABASE [${MSSQL_DATABASE}]'); PRINT 'Database ${MSSQL_DATABASE} created'; END ELSE BEGIN PRINT 'Database ${MSSQL_DATABASE} already exists'; END"
    networks:
      - sg-services-network

  # ---------------------------------------------------------------------------
  # Liquibase bootstrap, split into three globally ordered phases.
  #
  # The schema has cross-schema foreign keys (iam <-> school, iam <->
  # user-management, fleet/route/notification -> ...) and the seed data has
  # cross-schema row references, so a single ordered pass per service cannot
  # work (it is circular). See bootstrap/*.sh for the details.
  # ---------------------------------------------------------------------------

  liquibase-tables:
    <<: *liquibase
    container_name: school-guardian-db-tables
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "/db/bootstrap/01-tables.sh"]

  liquibase-constraints:
    <<: *liquibase
    container_name: school-guardian-db-constraints
    depends_on:
      liquibase-tables:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "/db/bootstrap/02-constraints.sh"]

  liquibase-data:
    <<: *liquibase
    container_name: school-guardian-db-data
    depends_on:
      liquibase-constraints:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "/db/bootstrap/03-data.sh"]

volumes:
  school-guardian-sqlserver-data:

networks:
  sg-services-network:
    external: true
